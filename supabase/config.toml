[functions.ingest]
enabled = true
verify_jwt = true
entrypoint = "./functions/ingest/index.ts"

# verify_jwt = true: the gateway rejects anonymous calls (401) before the
# function runs. The admin UI sends the signed-in curator's access token,
# and the function additionally checks auth.email() against ADMIN_EMAILS.
# Requires: supabase secrets set ADMIN_EMAILS="you@gmail.com"
